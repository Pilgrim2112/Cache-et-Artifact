name: Cache et Artifacts

on: push

jobs:
    install-et-build:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v5
        - uses: actions/setup-node@v4
          with: 
            node-version: 24.x
        - name: Restaurer le cache npm 
          uses:  actions/cache@v4
          with:
            path: ~/.npm
            key: npm-${{ hashFiles('package-lock.json') }}
            restore-keys: npm
        - run: npm ci
        - name: Simuler un build
          run: |
            mkdir dist
            cp hello.js dist/
            echo "Build du $(date)" > dist/build-info.txt
        - uses:  actions/upload-artifact@v5
          with:
            name:  dist-${{ github.sha }}
            path: dist/
            retention-days: 7
    deployer:
        needs: install-et-build
        runs-on: ubuntu-latest
        steps:
        - name:  Récupérer l'artifact du build
          uses:  actions/download-artifact@v5
          with:
            name:  dist-${{ github.sha }}
            path: dist/
        - name:  Vérifier le contenu reçu 
          run: |
             echo  "Fichiers reçus :" 
             ls dist/ 
             cat dist/build-info.txt
    hello:
        needs: deployer
        runs-on: ubuntu-latest
        steps: 
        - name: aficher le dragon
          run: npx cowsay -f dragon "Je suis le dragon"
        

